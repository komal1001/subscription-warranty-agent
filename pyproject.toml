[project]
name = "leak-detector"
version = "0.1.0"
description = "Local-first detector for subscription and warranty money leaks"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leak_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
